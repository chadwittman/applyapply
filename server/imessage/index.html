<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>applyapply · text line (test)</title>
<link rel="icon" href="/brand/icon-32.png">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#e9e9ee;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.08)}
.head{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid #e5e5ea;background:rgba(249,249,249,.94);display:grid;grid-template-columns:60px 1fr 60px;align-items:center}
.contact{display:flex;flex-direction:column;align-items:center;gap:3px}
.avatar{width:40px;height:40px;border-radius:50%;background:#0a0a0a;display:flex;align-items:center;justify-content:center}
.avatar img{width:22px;height:22px}
.name{font-size:12px;color:#111}
.reset{justify-self:end;background:none;border:0;color:#007aff;font-size:14px;cursor:pointer;padding:6px}
.note{background:#0a0a0a;color:#fff;font-size:12px;padding:7px 12px;text-align:center;line-height:1.4}
.thread{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:3px}
.b{max-width:78%;padding:8px 12px;border-radius:18px;font-size:16px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;cursor:pointer;-webkit-tap-highlight-color:transparent}
.in{align-self:flex-start;background:#e9e9eb;color:#000;border-bottom-left-radius:6px}
.out{align-self:flex-end;background:#007aff;color:#fff;border-bottom-right-radius:6px}
.b a{color:inherit;text-decoration:underline;word-break:break-all}
.gap{height:10px}
.unfurl{align-self:flex-start;max-width:78%;margin:2px 0 2px;border-radius:14px;overflow:hidden;background:#e9e9eb;display:block}
.unfurl img{display:block;width:100%;height:auto}
.typing{align-self:flex-start;background:#e9e9eb;border-radius:18px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.bar{display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e5e5ea;background:#f9f9f9}
.bar textarea{flex:1;resize:none;border:1px solid #c7c7cc;border-radius:18px;padding:8px 14px;font:inherit;font-size:16px;max-height:120px;outline:none;background:#fff}
.send{width:34px;height:34px;border-radius:50%;border:0;background:#007aff;color:#fff;font-size:18px;cursor:pointer;flex:none}
.send:disabled{background:#c7c7cc}
.mic{width:34px;height:34px;border-radius:50%;border:0;background:#e9e9eb;font-size:17px;cursor:pointer;flex:none}
.mic.on{background:#ff3b30;color:#fff;animation:rec 1.2s infinite}
@keyframes rec{50%{opacity:.6}}
.voice-tag{font-size:13px;opacity:.85;margin-right:4px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:14px;font-size:14px}
.gate{margin:auto;padding:24px;text-align:center;font-size:16px;line-height:1.5}
.gate a{display:inline-block;margin-top:12px;background:#007aff;color:#fff;padding:10px 18px;border-radius:18px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="phone">
  <div class="head">
    <span></span>
    <div class="contact"><div class="avatar"><img src="/brand/icon-32.png" alt=""></div><div class="name">applyapply ›</div></div>
    <button class="reset" id="reset" hidden>Reset</button>
  </div>
  <div class="note">Test line: real kits and real credits. Replies show here instead of in iMessage.</div>
  <div class="thread" id="thread"></div>
  <form class="bar" id="bar" hidden>
    <button class="mic" id="mic" type="button" aria-label="Record a voice note">🎤</button>
    <textarea id="text" rows="1" placeholder="iMessage" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">↑</button>
  </form>
</div>
<script src="/imessage/app.js"></script>
</body>
</html>
