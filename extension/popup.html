<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="wordmark">applyapply</span>
    <div class="status"><span class="dot" id="dot"></span><span id="status-text">connecting</span></div>
  </div>

  <div class="actions">
    <a id="btn-audit" class="btn primary" href="#" target="_blank">Find new jobs</a>
    <div class="btn-row">
      <button id="btn-apply" class="btn secondary">Apply to this page</button>
      <button id="btn-settings-toggle" class="btn secondary">Settings</button>
    </div>
    <div id="apply-note" class="note"></div>
    <div id="auto-row" class="note" style="display:none">
      <label style="display:flex;gap:7px;align-items:flex-start;cursor:pointer;line-height:1.45">
        <input type="checkbox" id="auto-detect" style="margin-top:2px;flex:none">
        <span>Spot job pages on any site automatically. Off by default &mdash; without it, applyapply works on the big job boards on its own, and anywhere else when you open this popup.</span>
      </label>
    </div>
  </div>

  <div id="settings-panel" style="display:none">
    <div class="settings-body">
      <!-- Auth state: signed in -->
      <div id="auth-signed-in" style="display:none">
        <div class="auth-row">
          <span id="auth-email" class="auth-email"></span>
          <span id="auth-credits" style="font-size:10px;color:#444;flex-shrink:0"></span>
          <button id="btn-signout" class="signout-btn">Sign out</button>
        </div>
        <div class="divider"></div>
        <label class="setting-check">
          <input type="checkbox" id="always-regenerate">
          <span><b>Always generate a fresh application</b><small>Uses generation credits each time you open a job.</small></span>
        </label>
        <div class="divider"></div>
        <div class="field-row">Profile</div>
        <div class="profile-grid">
          <label>First<input type="text" class="field-input" data-field="first_name"></label>
          <label>Last<input type="text" class="field-input" data-field="last_name"></label>
          <label>Email<input type="email" class="field-input" data-field="email"></label>
          <label>Phone<input type="tel" class="field-input" data-field="phone"></label>
          <label>LinkedIn<input type="url" class="field-input" data-field="linkedin"></label>
          <label>Location<input type="text" class="field-input" data-field="location"></label>
          <label>US work authorization<select class="field-input" data-field="work_authorization"><option value="">Unknown</option><option value="yes">Yes</option><option value="no">No</option></select></label>
          <label>Need sponsorship<select class="field-input" data-field="sponsorship"><option value="">Unknown</option><option value="yes">Yes</option><option value="no">No</option></select></label>
          <label>Salary<input type="text" class="field-input" data-field="salary"></label>
          <label>Job search<select class="field-input" data-field="search_mode"><option value="active">Actively looking</option><option value="selective">Selective</option></select></label>
        </div>
        <div class="save-row">
          <button id="saveSettings" class="save-btn">Save</button>
          <button id="btn-setup" class="setup-link">Full profile →</button>
        </div>
        <div id="save-status" class="save-status"></div>
      </div>

      <!-- Auth state: signed out -->
      <div id="auth-signed-out">
        <button id="btn-signin" class="btn primary" style="margin-top:4px">Sign in</button>
        <div class="auth-hint">Opens a sign-in page in your browser</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
